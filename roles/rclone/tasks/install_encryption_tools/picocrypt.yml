- name: Ensure golang is installed
  apt:
    name: golang
    state: present
    update_cache: true

- name: Install picocrypt CLI v1 via go
  command: >
    go install github.com/HACKERALERT/Picocrypt/cli/v1/picocrypt@latest
  environment:
    GOPATH: /root/go
  args:
    creates: /root/go/bin/picocrypt

- name: Ensure picocrypt v1 binary is executable
  file:
    path: /root/go/bin/picocrypt
    mode: '0755'

- name: Check current /usr/local/bin/picocrypt
  stat:
    path: /usr/local/bin/picocrypt
  register: picocrypt_usr_stat

- name: Remove /usr/local/bin/picocrypt if it is not the desired symlink
  file:
    path: /usr/local/bin/picocrypt
    state: absent
  when: >
    picocrypt_usr_stat.stat.exists and
    (
      not picocrypt_usr_stat.stat.islnk or
      picocrypt_usr_stat.stat.lnk_source != '/root/go/bin/picocrypt'
    )

- name: Copy picocrypt v1 binary into /usr/local/bin
  copy:
    src: /root/go/bin/picocrypt
    dest: /usr/local/bin/picocrypt
    mode: '0755'
    remote_src: true
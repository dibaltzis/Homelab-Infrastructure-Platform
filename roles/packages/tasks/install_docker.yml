- name: Install required packages for Docker repo
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true
 
- name: Create directory for Docker GPG key
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
 
- name: Add Docker official GPG key
  shell: |
    curl -fsSL https://download.docker.com/linux/debian/gpg \
    | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
 
- name: Add Docker apt repository
  apt_repository:
    repo: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/debian
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker
 
- name: Update apt cache after adding Docker repo
  apt:
    update_cache: true
 
- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
 
- name: Enable and start Docker service
  systemd:
    name: docker
    enabled: true
    state: started

- name: Add primary user to docker group
  user:
    name: "{{ primary_user }}"
    groups: docker
    append: true  
  notify: Docker group membership reminder

- name: Get docker group entry
  getent:
    database: group
    key: docker
  register: docker_group_entry
  
- name: Set docker group id fact
  set_fact:
    docker_group_id: "{{ docker_group_entry.ansible_facts.getent_group.docker[1] }}"
  
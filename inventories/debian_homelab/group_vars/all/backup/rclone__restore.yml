        pre_commands: []
        post_commands: []

    hyperion:
      enabled: true #"{{ b2_enabled | bool }}"
      force_restore: "{{ force_restore_enabled | bool }}"
      source:
        remote: b2_account
        bucket: Homelab-dibal
